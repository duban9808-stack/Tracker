                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xs font-bold text-textSecondary uppercase tracking-wider">% del 1RM</h3>
                        <select id="rmFormulaSelect" onchange="app.calculateRM()" class="input-field px-3 py-1.5 text-xs text-white font-bold appearance-none cursor-pointer">
                            <option value="avg" ${Storage.getPreferredFormula() === 'avg' ? 'selected' : ''}>Promedio</option>
                            <option value="Epley" ${Storage.getPreferredFormula() === 'Epley' ? 'selected' : ''}>Epley</option>
                            <option value="Brzycki" ${Storage.getPreferredFormula() === 'Brzycki' ? 'selected' : ''}>Brzycki</option>
                            <option value="Lombardi" ${Storage.getPreferredFormula() === 'Lombardi' ? 'selected' : ''}>Lombardi</option>
                            <option value="O'Conner" ${Storage.getPreferredFormula() === "O'Conner" ? 'selected' : ''}>O'Conner</option>
                            <option value="Lander" ${Storage.getPreferredFormula() === 'Lander' ? 'selected' : ''}>Lander</option>
                            <option value="Mayhew" ${Storage.getPreferredFormula() === 'Mayhew' ? 'selected' : ''}>Mayhew</option>
                            <option value="Wathan" ${Storage.getPreferredFormula() === 'Wathan' ? 'selected' : ''}>Wathan</option>
                        </select>
                    </div>
                    <div id="rmPercentTable" class="grid grid-cols-5 gap-2 text-center"></div>
                </div>

                <div class="card p-5">
                    <h3 class="text-xs font-bold text-textSecondary uppercase tracking-wider mb-3">Guía de fórmulas</h3>
                    <div class="space-y-2.5 text-xs text-textMuted font-medium">
                        <p><strong class="text-text">Brzycki:</strong> Más precisa 1-10 reps. Estándar powerlifting.</p>
                        <p><strong class="text-text">Epley:</strong> Similar a Brzycki, optimista en reps altas.</p>
                        <p><strong class="text-text">Lombardi:</strong> Ideal para rangos altos (8-15 reps).</p>
                        <p><strong class="text-text">Lander:</strong> Alternativa para rangos medios.</p>
                        <p><strong class="text-text">O'Conner:</strong> Conservadora, para principiantes.</p>
                    </div>
                </div>
            </div>
        `;
        setTimeout(() => this.calculateRM(), 50);
    },

    calculateRM() {
        const weight = parseFloat(document.getElementById('rmWeight')?.value) || 0;
        const reps = parseFloat(document.getElementById('rmReps')?.value) || 0;

        if (weight <= 0 || reps <= 0) {
            document.getElementById('rmResults').innerHTML = '<p class="text-textMuted text-sm text-center py-4">Ingresa valores válidos</p>';
            document.getElementById('rmAverage').textContent = '--';
            return;
        }

        const formulas = [
            { name: 'Epley', color: '#ef4444', fn: (w, r) => w * (1 + r / 30) },
            { name: 'Brzycki', color: '#06b6d4', fn: (w, r) => w * (36 / (37 - r)) },
            { name: 'Lombardi', color: '#3b82f6', fn: (w, r) => w * Math.pow(r, 0.10) },
            { name: "O'Conner", color: '#22c55e', fn: (w, r) => w * (1 + 0.025 * r) },
            { name: 'Lander', color: '#f59e0b', fn: (w, r) => (100 * w) / (101.3 - 2.67123 * r) },
            { name: 'Mayhew', color: '#a855f7', fn: (w, r) => (100 * w) / (52.2 + (41.9 * Math.exp(-0.055 * r))) },
            { name: 'Wathan', color: '#f43f5e', fn: (w, r) => (100 * w) / (48.8 + (53.8 * Math.exp(-0.075 * r))) }
        ];

        let results = [];
        let total = 0, count = 0;

        formulas.forEach(f => {
            let rm = f.fn(weight, reps);
            if (!isFinite(rm) || isNaN(rm)) rm = 0;
            if (reps > 10 && rm > weight * 3) rm = 0;
            results.push({ name: f.name, color: f.color, rm });
            if (rm > 0) { total += rm; count++; }
        });

        const avg = count > 0 ? total / count : 0;

        document.getElementById('rmResults').innerHTML = results.map(r => {
            const diff = r.rm - avg;
            const diffStr = diff > 0 ? `+${diff.toFixed(1)}` : diff.toFixed(1);
            const diffColor = diff > 0 ? 'text-success' : (diff < 0 ? 'text-danger' : 'text-textMuted');
            return `
                <div class="flex items-center justify-between bg-white/3 rounded-xl px-4 py-3">
                    <div class="flex items-center gap-3">
                        <div class="w-2.5 h-2.5 rounded-full" style="background: ${r.color}"></div>
                        <span class="text-sm font-bold text-text">${r.name}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-sm font-black text-text">${r.rm.toFixed(1)} <span class="text-[10px] text-textMuted">kg</span></span>
                        <span class="text-xs ${diffColor} font-bold ml-2">${diffStr}</span>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('rmAverage').textContent = avg > 0 ? avg.toFixed(1) : '--';

        const selectEl = document.getElementById('rmFormulaSelect');
        const selectedFormula = selectEl?.value || 'avg';
        if (selectEl) Storage.setPreferredFormula(selectedFormula);
        let baseRM = avg;
        if (selectedFormula !== 'avg') {
            const selected = results.find(r => r.name === selectedFormula);
            if (selected && selected.rm > 0) baseRM = selected.rm;
        }

        const pctTable = document.getElementById('rmPercentTable');
        if (pctTable && baseRM > 0) {
            const percentages = [
                { pct: 100, reps: 1 }, { pct: 97, reps: 2 }, { pct: 94, reps: 3 },
                { pct: 92, reps: 4 }, { pct: 89, reps: 5 }, { pct: 86, reps: 6 },
                { pct: 83, reps: 7 }, { pct: 81, reps: 8 }, { pct: 78, reps: 9 },
                { pct: 75, reps: 10 }, { pct: 71, reps: 12 }, { pct: 67, reps: 15 }
            ];
            pctTable.innerHTML = percentages.map(p => {
                const w = (baseRM * p.pct / 100).toFixed(1);
                return `
                    <div class="bg-white/3 rounded-xl p-2">
                        <div class="text-warning font-black text-sm">${p.pct}%</div>
                        <div class="text-text font-bold text-sm">${w}</div>
                        <div class="text-textMuted text-[10px] font-semibold">${p.reps}r</div>
                    </div>
                `;
            }).join('');
        }
    },

    convertWeight(from) {
        const kgInput = document.getElementById('convKg');
        const lbInput = document.getElementById('convLb');
        const rmWeight = document.getElementById('rmWeight');
        if (!kgInput || !lbInput) return;
        let kgVal = null;
        if (from === 'kg') {
            const kg = parseFloat(kgInput.value);
            if (!isNaN(kg)) {
                lbInput.value = (kg * 2.20462).toFixed(2);
                kgVal = kg;
            } else {
                lbInput.value = '';
            }
        } else {
            const lb = parseFloat(lbInput.value);
            if (!isNaN(lb)) {
                kgVal = lb / 2.20462;
                kgInput.value = kgVal.toFixed(2);
            } else {
                kgInput.value = '';
            }
        }
        // Pasar el valor kg a la calculadora RM y recalcular
        if (rmWeight && kgVal !== null && !isNaN(kgVal)) {
            rmWeight.value = Math.round(kgVal * 10) / 10;
            this.calculateRM();
        }
    },

    fillFromLastWorkout() {
        const workouts = this.workouts;
        if (workouts.length === 0) { this.showToast('Sin entrenamientos previos', 'error'); return; }
        const lastEntry = workouts[workouts.length - 1].entries?.slice(-1)[0];
        if (!lastEntry) { this.showToast('Sin series registradas', 'error'); return; }
        document.getElementById('rmWeight').value = lastEntry.weight;
        document.getElementById('rmReps').value = lastEntry.reps;
        this.calculateRM();
        this.showToast('Datos cargados');
    },


    showEntryActions(tempId) {
        const entry = this.currentWorkout.entries.find(e => e.tempId === tempId);
        if (!entry) return;
        const ex = this.exercises.find(e => e.id === entry.exerciseId);
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <h3 class="text-xl font-black text-text mb-1 tracking-tight">Serie ${entry.seriesNum}</h3>
            <p class="text-textSecondary text-sm mb-6">${ex?.name || 'Ejercicio'}</p>
            <div class="space-y-3">
                <button onclick="app.closeModal(); app.editEntry('${tempId}')" class="touch w-full py-3.5 bg-primary/15 hover:bg-primary/25 text-primary font-bold rounded-2xl text-sm transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-pen"></i>Editar serie
                </button>
                <button onclick="app.confirmDeleteEntry('${tempId}')" class="touch w-full py-3.5 bg-danger/10 hover:bg-danger/15 text-danger font-bold rounded-2xl text-sm transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-trash"></i>Eliminar serie
                </button>
                <button onclick="app.closeModal()" class="touch w-full py-3 bg-white/5 hover:bg-white/10 text-text font-bold rounded-2xl text-sm transition-colors">
                    Cancelar
                </button>
            </div>
        `;
        document.getElementById('modalOverlay').classList.remove('hidden');
    },

    confirmDeleteEntry(tempId) {
        const entry = this.currentWorkout.entries.find(e => e.tempId === tempId);
        if (!entry) return;
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-full bg-danger/10 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-trash text-danger text-xl"></i>
                </div>
                <h3 class="text-xl font-black text-text tracking-tight">¿Eliminar serie?</h3>
                <p class="text-sm text-textSecondary mt-1">Esta acción no se puede deshacer</p>
            </div>
            <div class="flex gap-3">
                <button onclick="app.closeModal()" class="touch flex-1 py-3 bg-white/5 hover:bg-white/10 text-text font-bold rounded-xl text-sm transition-colors">Cancelar</button>
                <button onclick="app.closeModal(); app.deleteEntry('${tempId}')" class="touch flex-1 py-3 bg-danger hover:bg-danger/90 text-white font-bold rounded-xl text-sm transition-colors">Eliminar</button>
            </div>
        `;
    },

    editEntry(tempId) {
        const entry = this.currentWorkout.entries.find(e => e.tempId === tempId);
        if (!entry) return;
        const ex = this.exercises.find(e => e.id === entry.exerciseId);
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <h3 class="text-xl font-black text-text mb-1 tracking-tight">Editar serie</h3>
            <p class="text-textSecondary text-sm mb-5">${ex?.name || 'Ejercicio'} — Serie ${entry.seriesNum}</p>
            <div class="space-y-4">
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2 text-center">Peso kg</label>
                        <input type="number" id="editWeight" value="${entry.weight}" class="input-field w-full h-12 text-center text-white font-black text-xl">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2 text-center">Reps</label>
                        <input type="number" id="editReps" value="${entry.reps}" class="input-field w-full h-12 text-center text-white font-black text-xl">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2 text-center">RIR</label>
                        <select id="editRIR" class="input-field w-full h-12 text-center text-white font-bold text-lg appearance-none cursor-pointer">
                            <option value="0" ${entry.rir === 0 ? 'selected' : ''}>0</option>
                            <option value="0.5" ${entry.rir === 0.5 ? 'selected' : ''}>0.5</option>
                            <option value="1" ${entry.rir === 1 ? 'selected' : ''}>1</option>
                            <option value="1.5" ${entry.rir === 1.5 ? 'selected' : ''}>1.5</option>
                            <option value="2" ${entry.rir === 2 ? 'selected' : ''}>2</option>
                            <option value="2.5" ${entry.rir === 2.5 ? 'selected' : ''}>2.5</option>
                            <option value="3" ${entry.rir === 3 ? 'selected' : ''}>3</option>
                            <option value="4" ${entry.rir === 4 ? 'selected' : ''}>4</option>
                            <option value="5" ${entry.rir === 5 ? 'selected' : ''}>5</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="app.closeModal()" class="touch flex-1 py-3 bg-white/5 hover:bg-white/10 text-text font-bold rounded-xl text-sm transition-colors">Cancelar</button>
                    <button onclick="app.saveEditEntry('${tempId}')" class="touch flex-1 btn-primary py-3 text-sm">Guardar</button>
                </div>
            </div>
        `;
        document.getElementById('modalOverlay').classList.remove('hidden');
    },

    saveEditEntry(tempId) {
        const weight = parseFloat(document.getElementById('editWeight').value);
        const reps = parseInt(document.getElementById('editReps').value);
        const rir = parseFloat(document.getElementById('editRIR').value);
        if (!weight || !reps || weight <= 0 || reps <= 0) {
            this.showToast('Ingresa valores válidos', 'error');
            return;
        }
        this.currentWorkout.entries = this.currentWorkout.entries.map(e => {
            if (e.tempId === tempId) {
                return { ...e, weight, reps, rir };
            }
            return e;
        });
        Storage.setCurrentWorkout(this.currentWorkout);
        this.closeModal();
        this.showToast('Serie actualizada ✏️');
        this.renderWorkout();
    },

    closeModal() {
        document.getElementById('modalOverlay').classList.add('hidden');
    },

    showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
        toast.className = `fixed top-24 left-1/2 -translate-x-1/2 z-[70] px-5 py-3 rounded-2xl shadow-2xl font-bold text-sm hidden flex items-center gap-2.5 toast-enter ${type === 'error' ? 'bg-danger' : 'bg-success'} text-white`;
        toast.innerHTML = `<i class="fas ${icon} text-lg"></i><span id="toastMsg">${msg}</span>`;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2500);
    },

    newWorkout() {
        if (this.currentWorkout && this.currentWorkout.entries.length > 0) {
            if (!confirm('Tienes un entrenamiento en progreso. ¿Descartarlo y empezar uno nuevo?')) return;
        }
        Storage.clearCurrentWorkout();
        this.currentWorkout = null;
        this.resetRestTimer();
        this.showView('workout');
    }
};

document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') app.closeModal();
});

app.init();
</script>
</body>
</html>
