<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <title>Tracker Fuerza</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bg: '#0a0f1a',
                        surface: '#111827',
                        surfaceHover: '#1a2236',
                        border: 'rgba(255,255,255,0.06)',
                        borderHover: 'rgba(255,255,255,0.12)',
                        primary: '#3b82f6',
                        primaryHover: '#2563eb',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        text: '#f9fafb',
                        textSecondary: '#9ca3af',
                        textMuted: '#6b7280',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0f1a; color: #f9fafb; overscroll-behavior-y: none; }

        /* Scrollbar hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Touch feedback */
        .touch { transition: transform 0.12s ease, opacity 0.12s ease; }
        .touch:active { transform: scale(0.97); opacity: 0.9; }

        /* Animations */
        .fade-up { animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.10s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.20s; }
        .stagger-5 { animation-delay: 0.25s; }

        /* Glass nav */
        .nav-glass { background: rgba(10, 15, 26, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

        /* Card styles */
        .card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            transition: all 0.2s ease;
        }
        .card:hover { border-color: rgba(255,255,255,0.10); }

        /* Input styles */
        .input-field {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            transition: all 0.2s ease;
        }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); outline: none; }

        /* Button primary */
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 16px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(59,130,246,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(59,130,246,0.35); }
        .btn-primary:active { transform: translateY(0); }

        /* Button ghost */
        .btn-ghost {
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.10); }

        /* Category card */
        .cat-card {
            background: linear-gradient(145deg, #111827 0%, #0d1320 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cat-card:hover {
            transform: translateY(-4px);
            border-color: var(--cat-color, rgba(255,255,255,0.12));
            box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--cat-color, transparent);
        }
        .cat-card:active { transform: translateY(-1px) scale(0.98); }

        /* Series row */
        .series-row {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border-left: 3px solid var(--cat-color, #3b82f6);
            transition: all 0.15s ease;
        }
        .series-row:hover { background: rgba(255,255,255,0.05); }

        /* Nav item */
        .nav-item { position: relative; transition: all 0.2s ease; }
        .nav-item.active { color: #3b82f6; }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #3b82f6;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(59,130,246,0.6);
        }

        /* Number input hide spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* Chart container */
        .chart-box { position: relative; height: 200px; width: 100%; }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* Record indicator */
        .record-flash {
            animation: recordFlash 0.6s ease-out;
        }
        @keyframes recordFlash {
            0% { background: rgba(34,197,94,0.2); }
            100% { background: transparent; }
        }

        /* Toast */
        .toast-enter { animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px) scale(0.95); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        /* Modal overlay */
        .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }

        /* Rest day card */
        .rest-card {
            background: linear-gradient(135deg, rgba(17,24,39,0.9) 0%, rgba(10,15,26,0.95) 100%);
            border: 1px solid rgba(148,163,184,0.15);
            border-radius: 24px;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<base target="_blank">
</head>
<body class="min-h-screen pb-28">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 nav-glass border-b border-white/5">
        <div class="flex items-center justify-between px-5 py-4 max-w-lg mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-primary/15 flex items-center justify-center">
                    <i class="fas fa-dumbbell text-primary text-sm"></i>
                </div>
                <span class="font-bold text-base tracking-tight">Tracker</span>
            </div>
            <button onclick="app.newWorkout()" class="touch btn-primary text-white px-5 py-2.5 text-sm flex items-center gap-2">
                <i class="fas fa-plus text-xs"></i>Entrenar
            </button>
        </div>
    </header>

    <!-- Main -->
    <main id="mainContent" class="pt-20 px-5 max-w-lg mx-auto"></main>

    <!-- Bottom Bars (referencia + cronómetro, arriba del nav) -->
    <div id="bottomBars" class="fixed bottom-[80px] left-0 right-0 z-50 hidden" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <!-- Reference Bar -->
        <div class="nav-glass border-t border-white/5">
            <div class="max-w-lg mx-auto px-5 py-2.5 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-book-open text-primary text-xs"></i>
                </div>
                <div class="flex-1 min-w-0" id="refPanel">
                    <!-- Contenido inyectado por renderWorkout() -->
                </div>
            </div>
        </div>
        <!-- Rest Timer Bar -->
        <div class="nav-glass border-t border-white/5">
            <div class="max-w-lg mx-auto px-5 py-2.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center">
                        <i class="fas fa-stopwatch text-primary text-xs"></i>
                    </div>
                    <div>
                        <div class="text-[9px] font-bold text-textMuted uppercase tracking-wider leading-none">Descanso</div>
                        <div id="restTimerDisplay" class="text-xl font-black tabular-nums leading-tight mt-0.5" style="color: #22c55e; font-variant-numeric: tabular-nums;">00:00</div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="app.toggleRestTimer()" id="restTimerToggle" class="touch w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center text-textMuted hover:text-text transition-colors">
                        <i class="fas fa-play text-[10px]" id="restTimerIcon"></i>
                    </button>
                    <button onclick="app.resetRestTimer()" class="touch w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center text-textMuted hover:text-text transition-colors">
                        <i class="fas fa-rotate-right text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 nav-glass border-t border-white/5" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="flex justify-around items-center py-3 max-w-lg mx-auto">
            <button onclick="app.showView('dashboard')" class="nav-item touch flex flex-col items-center gap-1 p-2 text-textMuted" data-view="dashboard">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] font-semibold">Inicio</span>
            </button>
            <button onclick="app.showView('workout')" class="nav-item touch flex flex-col items-center gap-1 p-2 text-textMuted" data-view="workout">
                <i class="fas fa-dumbbell text-lg"></i>
                <span class="text-[10px] font-semibold">Entrenar</span>
            </button>
            <button onclick="app.showView('history')" class="nav-item touch flex flex-col items-center gap-1 p-2 text-textMuted" data-view="history">
                <i class="fas fa-list text-lg"></i>
                <span class="text-[10px] font-semibold">Historial</span>
            </button>
            <button onclick="app.showView('progress')" class="nav-item touch flex flex-col items-center gap-1 p-2 text-textMuted" data-view="progress">
                <i class="fas fa-chart-line text-lg"></i>
                <span class="text-[10px] font-semibold">Progreso</span>
            </button>
            <button onclick="app.showView('rmcalc')" class="nav-item touch flex flex-col items-center gap-1 p-2 text-textMuted" data-view="rmcalc">
                <i class="fas fa-calculator text-lg"></i>
                <span class="text-[10px] font-semibold">Cálculo</span>
            </button>
            <button onclick="app.showView('settings')" class="nav-item touch flex flex-col items-center gap-1 p-2 text-textMuted" data-view="settings">
                <i class="fas fa-cog text-lg"></i>
                <span class="text-[10px] font-semibold">Más</span>
            </button>
        </div>
    </nav>

    <!-- Modal -->
    <div id="modalOverlay" class="fixed inset-0 modal-bg z-[60] hidden flex items-end sm:items-center justify-center p-4">
        <div id="modalContent" class="bg-surface border border-white/10 rounded-3xl w-full max-w-sm max-h-[85vh] overflow-y-auto p-6 shadow-2xl"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-24 left-1/2 z-[70] px-5 py-3 rounded-2xl shadow-2xl font-bold text-sm hidden flex items-center gap-2.5 toast-enter">
        <i class="fas fa-check-circle text-lg"></i>
        <span id="toastMsg"></span>
    </div>

<script>

const DEFAULT_CATEGORIES = [
    { id: 'cat1', name: 'Empuje', color: '#ef4444', icon: 'fa-hand-fist' },
    { id: 'cat2', name: 'Tracción', color: '#06b6d4', icon: 'fa-hand-back-fist' },
    { id: 'cat3', name: 'Pierna', color: '#3b82f6', icon: 'fa-person-running' },
    { id: 'cat4', name: 'Otros', color: '#22c55e', icon: 'fa-spa' },
    { id: 'cat5', name: 'Descanso', color: '#94a3b8', icon: 'fa-bed' }
];

const DEFAULT_EXERCISES = [
    { id: 'e1', name: 'Press Banca Plano', muscleGroup: 'Pecho', type: 'Compuesto', categoryIds: ['cat1'], notes: '' },
    { id: 'e2', name: 'Press Banca Inclinado', muscleGroup: 'Pecho', type: 'Compuesto', categoryIds: ['cat1'], notes: '' },
    { id: 'e3', name: 'Aperturas Mancuernas', muscleGroup: 'Pecho', type: 'Aislado', categoryIds: ['cat1'], notes: '' },
    { id: 'e4', name: 'Press Militar Barra', muscleGroup: 'Hombro', type: 'Compuesto', categoryIds: ['cat1','cat2'], notes: '' },
    { id: 'e5', name: 'Elevaciones Laterales', muscleGroup: 'Hombro', type: 'Aislado', categoryIds: ['cat1'], notes: '' },
    { id: 'e6', name: 'Fondos Paralelas', muscleGroup: 'Tríceps', type: 'Compuesto', categoryIds: ['cat1'], notes: '' },
    { id: 'e7', name: 'Extensiones Tríceps', muscleGroup: 'Tríceps', type: 'Aislado', categoryIds: ['cat1'], notes: '' },
    { id: 'e8', name: 'Remo Barra', muscleGroup: 'Espalda', type: 'Compuesto', categoryIds: ['cat2'], notes: '' },
    { id: 'e9', name: 'Dominadas', muscleGroup: 'Espalda', type: 'Compuesto', categoryIds: ['cat2'], notes: '' },
    { id: 'e10', name: 'Jalón al Pecho', muscleGroup: 'Espalda', type: 'Compuesto', categoryIds: ['cat2'], notes: '' },
    { id: 'e11', name: 'Remo Mancuerna', muscleGroup: 'Espalda', type: 'Aislado', categoryIds: ['cat2'], notes: '' },
    { id: 'e12', name: 'Face Pull', muscleGroup: 'Hombro Posterior', type: 'Aislado', categoryIds: ['cat2'], notes: '' },
    { id: 'e13', name: 'Curl Bíceps Barra', muscleGroup: 'Bíceps', type: 'Aislado', categoryIds: ['cat2'], notes: '' },
    { id: 'e14', name: 'Curl Martillo', muscleGroup: 'Bíceps', type: 'Aislado', categoryIds: ['cat2'], notes: '' },
    { id: 'e15', name: 'Sentadilla Barra', muscleGroup: 'Piernas', type: 'Compuesto', categoryIds: ['cat3'], notes: '' },
    { id: 'e16', name: 'Prensa Piernas', muscleGroup: 'Piernas', type: 'Compuesto', categoryIds: ['cat3'], notes: '' },
    { id: 'e17', name: 'Peso Muerto', muscleGroup: 'Piernas', type: 'Compuesto', categoryIds: ['cat3','cat2'], notes: '' },
    { id: 'e18', name: 'Hip Thrust', muscleGroup: 'Glúteos', type: 'Compuesto', categoryIds: ['cat3'], notes: '' },
    { id: 'e19', name: 'Extensiones Cuádriceps', muscleGroup: 'Piernas', type: 'Aislado', categoryIds: ['cat3'], notes: '' },
    { id: 'e20', name: 'Curl Femoral', muscleGroup: 'Piernas', type: 'Aislado', categoryIds: ['cat3'], notes: '' },
    { id: 'e21', name: 'Calf Raises', muscleGroup: 'Pantorrilla', type: 'Aislado', categoryIds: ['cat3'], notes: '' },
    { id: 'e22', name: 'Crunch', muscleGroup: 'Abdomen', type: 'Aislado', categoryIds: ['cat4'], notes: '' },
    { id: 'e23', name: 'Plancha', muscleGroup: 'Abdomen', type: 'Aislado', categoryIds: ['cat4'], notes: '' },
    { id: 'e24', name: 'Encogimientos Trapecio', muscleGroup: 'Trapecio', type: 'Aislado', categoryIds: ['cat4','cat2'], notes: '' }
];

const Storage = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)) || null; } catch { return null; } },
    set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
    getPreferredFormula() { return localStorage.getItem('preferredFormula') || 'avg'; },
    setPreferredFormula(val) { localStorage.setItem('preferredFormula', val); },
    getSheetsConfig() { 
        try { return JSON.parse(localStorage.getItem('sheetsConfig')) || { url: '', autoSave: false }; } 
        catch { return { url: '', autoSave: false }; }
    },
    setSheetsConfig(val) { localStorage.setItem('sheetsConfig', JSON.stringify(val)); },
    init() {
        let cats = Storage.get('categories');
        if (!cats) {
            Storage.set('categories', DEFAULT_CATEGORIES);
        } else {
            const hasRest = cats.some(c => c.id === 'cat5');
            if (!hasRest) {
                cats.push({ id: 'cat5', name: 'Descanso', color: '#94a3b8', icon: 'fa-bed' });
                Storage.set('categories', cats);
            }
        }
        let exs = Storage.get('exercises');
        if (!exs) {
            Storage.set('exercises', DEFAULT_EXERCISES);
        } else {
            const migrated = exs.map(e => {
                if (e.categoryId && !e.categoryIds) {
                    return { ...e, categoryIds: [e.categoryId], categoryId: undefined };
                }
                return e;
            });
            Storage.set('exercises', migrated);
        }
        if (!Storage.get('workouts')) Storage.set('workouts', []);
    },

    getCurrentWorkout() { return Storage.get('currentWorkout'); },
    setCurrentWorkout(val) { Storage.set('currentWorkout', val); },
    clearCurrentWorkout() { localStorage.removeItem('currentWorkout'); }
};


// Helper: Zona horaria Bogotá (UTC-5, sin DST)
const BogotaTime = {
    now() {
        return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Bogota' }));
    },
    toISOString(date = null) {
        const d = date ? new Date(date) : this.now();
        const bogota = new Date(d.toLocaleString('en-US', { timeZone: 'America/Bogota' }));
        // Ajustar a medianoche Bogotá
        bogota.setHours(12, 0, 0, 0);
        return bogota.toISOString();
    },
    toLocaleDateString(date, options = {}) {
        const d = date ? new Date(date) : this.now();
        return d.toLocaleDateString('es-CO', { timeZone: 'America/Bogota', ...options });
    },
    toDateInputValue(date = null) {
        const d = date ? new Date(date) : this.now();
        const bogota = new Date(d.toLocaleString('en-US', { timeZone: 'America/Bogota' }));
        const y = bogota.getFullYear();
        const m = String(bogota.getMonth() + 1).padStart(2, '0');
        const day = String(bogota.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    },
    parseDateInput(dateStr) {
        // dateStr es "YYYY-MM-DD", interpretar como fecha Bogotá a mediodía
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d, 17, 0, 0)); // 12:00 Bogotá = 17:00 UTC
    }
};

const app = {
    currentView: 'dashboard',
    currentWorkout: null,
    restTimer: { startTime: null, elapsed: 0, intervalId: null, running: false },
    refView: 'best', // 'best' | 'last'

    init() {
        Storage.init();
        // Restaurar entrenamiento en progreso si existe
        const saved = Storage.getCurrentWorkout();
        if (saved && saved.entries) {
            this.currentWorkout = saved;
        }
        this.showView('dashboard');
    },

    // ========== CRONÓMETRO DE DESCANSO ==========
    startRestTimer() {
        this.stopRestTimer();
        this.restTimer.startTime = Date.now() - this.restTimer.elapsed;
        this.restTimer.running = true;
        this.restTimer.intervalId = setInterval(() => {
            this.restTimer.elapsed = Date.now() - this.restTimer.startTime;
            this.updateRestTimerDisplay();
        }, 1000);
        this.updateRestTimerDisplay();
    },

    stopRestTimer() {
        if (this.restTimer.intervalId) {
            clearInterval(this.restTimer.intervalId);
            this.restTimer.intervalId = null;
        }
        this.restTimer.running = false;
        this.updateRestTimerDisplay();
    },

    resetRestTimer() {
        this.stopRestTimer();
        this.restTimer.elapsed = 0;
        this.restTimer.startTime = null;
        this.updateRestTimerDisplay();
    },

    formatRestTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    },

    updateRestTimerDisplay() {
        const el = document.getElementById('restTimerDisplay');
        if (!el) return;
        const timeStr = this.formatRestTime(this.restTimer.elapsed);
        el.textContent = timeStr;
        // Cambiar color según tiempo transcurrido
        const totalSeconds = Math.floor(this.restTimer.elapsed / 1000);
        if (totalSeconds < 60) {
            el.style.color = '#22c55e'; // verde
        } else if (totalSeconds < 120) {
            el.style.color = '#f59e0b'; // amarillo
        } else {
            el.style.color = '#ef4444'; // rojo
        }
        // Actualizar icono play/pausa
        const iconEl = document.getElementById('restTimerIcon');
        if (iconEl) {
            iconEl.className = this.restTimer.running ? 'fas fa-pause text-xs' : 'fas fa-play text-xs';
        }
    },

    toggleRefView() {
        this.refView = this.refView === 'best' ? 'last' : 'best';
        this.renderWorkout();
    },

    toggleRestTimer() {
        if (this.restTimer.running) {
            this.stopRestTimer();
        } else {
            this.startRestTimer();
        }
    },
    // =============================================


    get categories() { return Storage.get('categories') || []; },
    set categories(v) { Storage.set('categories', v); },
    get exercises() { return Storage.get('exercises') || []; },
    set exercises(v) { Storage.set('exercises', v); },
    get workouts() { return Storage.get('workouts') || []; },
    set workouts(v) { Storage.set('workouts', v); },

    getCategoryBadges(exerciseId) {
        const ex = this.exercises.find(e => e.id === exerciseId);
        if (!ex || !ex.categoryIds || ex.categoryIds.length === 0) return '';
        return ex.categoryIds.map(cid => {
            const cat = this.categories.find(c => c.id === cid);
            if (!cat) return '';
            return `<span class="badge" style="background:${cat.color}15; color:${cat.color}; border:1px solid ${cat.color}25">${cat.name}</span>`;
        }).join(' ');
    },

    showView(view) {
        this.currentView = view;
        // Controlar visibilidad del contenedor de barras fijas y padding del body
        const showBars = view === 'workout' && this.currentWorkout && !this.currentWorkout.isRest;
        const bottomBars = document.getElementById('bottomBars');
        if (bottomBars) bottomBars.classList.toggle('hidden', !showBars);
        document.body.classList.toggle('pb-56', showBars);
        document.body.classList.toggle('pb-28', !showBars);
        document.querySelectorAll('.nav-item').forEach(b => {
            const isActive = b.dataset.view === view;
            b.classList.toggle('active', isActive);
            b.classList.toggle('text-primary', isActive);
            b.classList.toggle('text-textMuted', !isActive);
        });
        const main = document.getElementById('mainContent');
        main.innerHTML = '';
        main.className = 'pt-20 px-5 max-w-lg mx-auto fade-up';
        switch(view) {
            case 'dashboard': this.renderDashboard(); break;
            case 'workout': this.renderWorkout(); break;
            case 'history': this.renderHistory(); break;
            case 'progress': this.renderProgress(); break;
            case 'settings': this.renderSettings(); break;
            case 'rmcalc': this.renderRMCalculator(); break;
        }
    },

    renderDashboard() {
        const workouts = this.workouts;
        const totalSessions = workouts.length;
        const restDays = workouts.filter(w => w.isRest || w.categoryId === 'cat5').length;
        const trainDays = totalSessions - restDays;
        const totalSeries = workouts.reduce((sum, w) => sum + (w.entries?.length || 0), 0);
        const totalVolume = workouts.reduce((sum, w) => sum + (w.entries?.reduce((s, e) => s + (e.weight * e.reps), 0) || 0), 0);
        const allRMs = workouts.flatMap(w => w.entries?.map(e => this.calcRM(e.weight, e.reps)) || []);
        const bestRM = allRMs.length ? Math.max(...allRMs).toFixed(1) : 0;
        const lastWorkout = workouts.length ? [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date))[0] : null;
        const lastDate = lastWorkout ? BogotaTime.toLocaleDateString(lastWorkout.date, {day:'numeric', month:'short'}) : null;

        document.getElementById('mainContent').innerHTML = `
            <div class="space-y-6 pb-8">

                <!-- Entrenamiento en progreso -->
                ${this.currentWorkout ? (() => {
                    const cw = this.currentWorkout;
                    const cwCat = this.categories.find(c => c.id === cw.categoryId);
                    const cwEntries = cw.entries?.length || 0;
                    const cwVol = cw.entries?.reduce((s, e) => s + e.weight * e.reps, 0) || 0;
                    return `
                    <div class="card p-4 border-l-4 border-primary fade-up" style="border-left-color: ${cwCat?.color || '#3b82f6'}">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: ${cwCat?.color}15">
                                    <i class="fas ${cwCat?.icon || 'fa-dumbbell'}" style="color: ${cwCat?.color}"></i>
                                </div>
                                <div>
                                    <div class="text-sm font-bold text-text">Entrenamiento en progreso</div>
                                    <div class="text-xs text-textMuted">${cwCat?.name} · ${cwEntries} series · ${cwVol.toLocaleString()} kg</div>
                                </div>
                            </div>
                            <button onclick="app.showView('workout')" class="touch btn-primary px-4 py-2 text-xs">Continuar</button>
                        </div>
                    </div>`;
                })() : ''}

                <!-- Hero: Último entrenamiento -->
                <div class="fade-up">
                    ${lastWorkout ? (() => {
                        const cat = this.categories.find(c => c.id === lastWorkout.categoryId);
                        const isRest = lastWorkout.isRest || cat?.id === 'cat5';
                        const vol = lastWorkout.entries?.reduce((s,e) => s + e.weight * e.reps, 0) || 0;
                        return `
                        <div class="card p-5" style="background: linear-gradient(135deg, ${isRest ? '#1e293b' : cat?.color + '12'} 0%, #111827 100%); border-color: ${isRest ? 'rgba(255,255,255,0.06)' : cat?.color + '30'}">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-[10px] font-bold text-textMuted uppercase tracking-widest">Última sesión · ${lastDate}</span>
                                <div class="w-2 h-2 rounded-full" style="background: ${cat?.color || '#6b7280'}; box-shadow: 0 0 8px ${cat?.color || '#6b7280'}60"></div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl" style="background: ${cat?.color}18; color: ${cat?.color}">
                                    <i class="fas ${cat?.icon || 'fa-dumbbell'}"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-black text-text tracking-tight">${cat?.name || 'Sin categoría'}</h2>
                                    <p class="text-sm text-textSecondary font-medium mt-0.5">${isRest ? 'Día de recuperación' : `${lastWorkout.entries?.length || 0} series · ${vol.toLocaleString()} kg`}</p>
                                </div>
                            </div>
                        </div>`;
                    })() : `
                        <div class="card p-8 text-center">
                            <div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center mx-auto mb-4">
                                <i class="fas fa-dumbbell text-primary text-2xl"></i>
                            </div>
                            <h2 class="text-lg font-bold text-text">Comienza tu primer entrenamiento</h2>
                            <p class="text-sm text-textSecondary mt-1">Toca Entrenar para registrar tu progreso</p>
                        </div>
                    `}
                </div>

                <!-- KPIs horizontales -->
                <div class="fade-up stagger-1">
                    <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                        <div class="flex-shrink-0 card p-4 min-w-[110px] text-center">
                            <div class="text-2xl font-black text-primary">${trainDays}</div>
                            <div class="text-[10px] font-bold text-textMuted uppercase tracking-wider mt-1">Entrenos</div>
                        </div>
                        <div class="flex-shrink-0 card p-4 min-w-[110px] text-center">
                            <div class="text-2xl font-black text-success">${restDays}</div>
                            <div class="text-[10px] font-bold text-textMuted uppercase tracking-wider mt-1">Descansos</div>
                        </div>
                        <div class="flex-shrink-0 card p-4 min-w-[110px] text-center">
                            <div class="text-2xl font-black text-warning">${totalSeries}</div>
                            <div class="text-[10px] font-bold text-textMuted uppercase tracking-wider mt-1">Series</div>
                        </div>
                        <div class="flex-shrink-0 card p-4 min-w-[110px] text-center">
                            <div class="text-2xl font-black text-purple-400">${bestRM}</div>
                            <div class="text-[10px] font-bold text-textMuted uppercase tracking-wider mt-1">Mejor RM</div>
                        </div>
                        <div class="flex-shrink-0 card p-4 min-w-[110px] text-center">
                            <div class="text-2xl font-black text-text">${(totalVolume/1000).toFixed(1)}k</div>
                            <div class="text-[10px] font-bold text-textMuted uppercase tracking-wider mt-1">Volumen</div>
                        </div>
                    </div>
                </div>

                <!-- Resumen por categoría -->
                <div class="fade-up stagger-2">
                    <h3 class="text-sm font-bold text-textSecondary uppercase tracking-wider mb-3">Por categoría</h3>
                    <div class="space-y-2">
                        ${this.categories.filter(c => c.id !== 'cat5').map(cat => {
                            const catWorkouts = workouts.filter(w => w.categoryId === cat.id && !w.isRest);
                            const catVolume = catWorkouts.reduce((sum, w) => sum + (w.entries?.reduce((s, e) => s + e.weight * e.reps, 0) || 0), 0);
                            const catSeries = catWorkouts.reduce((sum, w) => sum + (w.entries?.length || 0), 0);
                            const totalCatVol = this.categories.filter(c => c.id !== 'cat5').reduce((sum, c) => {
                                const cw = workouts.filter(w => w.categoryId === c.id && !w.isRest);
                                return sum + cw.reduce((s, w) => s + (w.entries?.reduce((ss, e) => ss + e.weight * e.reps, 0) || 0), 0);
                            }, 0) || 1;
                            const pct = Math.round((catVolume / totalCatVol) * 100);
                            return `
                            <div class="card p-4 flex items-center gap-4">
                                <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style="background: ${cat.color}15">
                                    <i class="fas ${cat.icon} text-lg" style="color: ${cat.color}"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span class="font-bold text-sm text-text">${cat.name}</span>
                                        <span class="text-xs font-black" style="color: ${cat.color}">${catVolume.toLocaleString()} <span class="text-textMuted font-medium">kg</span></span>
                                    </div>
                                    <div class="h-1.5 bg-black/40 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full transition-all duration-700" style="width: ${pct}%; background: ${cat.color}; box-shadow: 0 0 6px ${cat.color}40"></div>
                                    </div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>

                <!-- Acceso rápido -->
                <div class="fade-up stagger-3">
                    <h3 class="text-sm font-bold text-textSecondary uppercase tracking-wider mb-3">Acceso rápido</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="app.showView('progress')" class="touch card p-4 text-left">
                            <div class="w-10 h-10 rounded-xl bg-purple-500/10 flex items-center justify-center mb-3">
                                <i class="fas fa-chart-line text-purple-400 text-sm"></i>
                            </div>
                            <div class="font-bold text-sm text-text">Ver progreso</div>
                            <div class="text-xs text-textMuted mt-0.5">Gráficas y récords</div>
                        </button>
                        <button onclick="app.showView('rmcalc')" class="touch card p-4 text-left">
                            <div class="w-10 h-10 rounded-xl bg-cyan-500/10 flex items-center justify-center mb-3">
                                <i class="fas fa-calculator text-cyan-400 text-sm"></i>
                            </div>
                            <div class="font-bold text-sm text-text">Calcular RM</div>
                            <div class="text-xs text-textMuted mt-0.5">7 fórmulas</div>
                        </button>
                    </div>
                </div>
            </div>
        `;
    },

    renderWorkout() {
        // Controlar visibilidad del contenedor de barras fijas
        const showBars = this.currentWorkout && !this.currentWorkout.isRest;
        const bottomBars = document.getElementById('bottomBars');
        const refPanel = document.getElementById('refPanel');
        if (bottomBars) bottomBars.classList.toggle('hidden', !showBars);
        if (refPanel && showBars) refPanel.innerHTML = this.renderReferenceContent();
        if (!this.currentWorkout) {
            document.getElementById('mainContent').innerHTML = `
                <div class="space-y-6 pb-8 fade-up">
                    <div>
                        <h2 class="text-2xl font-black text-text tracking-tight">Nuevo entrenamiento</h2>
                        <p class="text-sm text-textSecondary mt-1">Elige la categoría de hoy</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        ${this.categories.map(cat => `
                            <button onclick="app.showDatePickerModal('${cat.id}')" class="cat-card touch p-5 flex flex-col items-center gap-3 text-center" style="--cat-color: ${cat.color}30">
                                <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-xl" style="background: ${cat.color}15; color: ${cat.color}; box-shadow: 0 4px 16px ${cat.color}15">
                                    <i class="fas ${cat.icon}"></i>
                                </div>
                                <span class="font-bold text-sm text-text">${cat.name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            return;
        }

        const cat = this.categories.find(c => c.id === this.currentWorkout.categoryId);

        // Interfaz de descanso
        if (this.currentWorkout.isRest) {
            document.getElementById('mainContent').innerHTML = `
                <div class="space-y-6 pb-8 fade-up">
                    <div class="rest-card p-8 text-center">
                        <div class="w-20 h-20 rounded-full bg-slate-700/30 flex items-center justify-center mx-auto mb-5" style="box-shadow: 0 0 40px ${cat.color}15">
                            <i class="fas ${cat.icon} text-4xl" style="color: ${cat.color}"></i>
                        </div>
                        <h2 class="text-2xl font-black text-text tracking-tight">${cat.name}</h2>
                        <p class="text-sm text-textSecondary mt-2">${BogotaTime.toLocaleDateString(this.currentWorkout.date, {weekday:'long', day:'numeric', month:'long'})}</p>

                        <div class="mt-8 space-y-4">
                            <div class="flex items-center justify-center gap-8">
                                <div class="text-center">
                                    <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center mx-auto mb-2">
                                        <i class="fas fa-moon text-textSecondary text-lg"></i>
                                    </div>
                                    <span class="text-[10px] font-bold text-textMuted uppercase tracking-wider">Sueño</span>
                                </div>
                                <div class="text-center">
                                    <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center mx-auto mb-2">
                                        <i class="fas fa-glass-water text-textSecondary text-lg"></i>
                                    </div>
                                    <span class="text-[10px] font-bold text-textMuted uppercase tracking-wider">Agua</span>
                                </div>
                                <div class="text-center">
                                    <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center mx-auto mb-2">
                                        <i class="fas fa-carrot text-textSecondary text-lg"></i>
                                    </div>
                                    <span class="text-[10px] font-bold text-textMuted uppercase tracking-wider">Comida</span>
                                </div>
                            </div>

                            <button onclick="app.finishWorkout()" class="touch btn-primary w-full py-4 text-sm mt-4">
                                <i class="fas fa-check mr-2"></i>Registrar descanso
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return;
        }

        const exercises = this.exercises.filter(e => e.categoryIds && e.categoryIds.includes(this.currentWorkout.categoryId));
        const currentExerciseId = this.currentWorkout.currentExerciseId;
        const currentExercise = this.exercises.find(e => e.id === currentExerciseId);
        const currentEntries = this.currentWorkout.entries.filter(e => e.exerciseId === currentExerciseId);
        const seriesNum = currentEntries.length + 1;
        const sessionEntries = this.currentWorkout.entries;
        const sessionVolume = sessionEntries.reduce((s, e) => s + e.weight * e.reps, 0);
        const bestWeight = currentExerciseId ? this.getBestWeightForExercise(currentExerciseId) : null;

        document.getElementById('mainContent').innerHTML = `
            <div class="space-y-5 pb-8 fade-up" style="--cat-color: ${cat.color}">

                <!-- Header workout -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: ${cat.color}15; box-shadow: 0 0 12px ${cat.color}15">
                            <i class="fas ${cat.icon}" style="color: ${cat.color}"></i>
                        </div>
                        <div>
                            <div class="font-bold text-text">${cat.name}</div>
                            <div class="text-xs text-textMuted font-medium">${sessionEntries.length} series · ${sessionVolume.toLocaleString()} kg</div>
                        </div>
                    </div>
                    <button onclick="app.finishWorkout()" class="touch bg-success/15 text-success px-4 py-2.5 rounded-xl text-xs font-bold hover:bg-success/25 transition-colors">
                        <i class="fas fa-check mr-1"></i>Finalizar
                    </button>
                </div>

                <!-- Selector ejercicio -->
                <div class="card p-4">
                    <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2">Ejercicio</label>
                    <select id="exerciseSelect" onchange="app.changeExercise(this.value)" class="input-field w-full px-4 py-3 text-white font-bold text-sm appearance-none cursor-pointer">
                        ${exercises.map(e => `<option value="${e.id}" ${e.id === currentExerciseId ? 'selected' : ''}>${e.name}</option>`).join('')}
                    </select>

                </div>

                <!-- Input serie -->
                <div class="card p-5" style="border-color: ${cat.color}25">
                    <div class="flex items-center justify-between mb-5">
                        <span class="text-lg font-black text-text">Serie ${seriesNum}</span>
                        <span class="text-xs font-bold text-textMuted bg-white/5 px-2.5 py-1 rounded-lg">${currentExercise?.name}</span>
                    </div>

                    <div class="grid grid-cols-3 gap-3 mb-5">
                        <div>
                            <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2 text-center">Peso kg</label>
                            <div class="flex items-center gap-1">
                                <button onclick="app.adjustValue('weight', -2.5)" class="touch w-9 h-12 bg-white/5 hover:bg-white/10 rounded-xl text-textMuted flex items-center justify-center text-xs"><i class="fas fa-minus"></i></button>
                                <input type="number" id="inputWeight" value="${bestWeight || ''}" placeholder="0" class="input-field w-full h-12 text-center text-white font-black text-xl">
                                <button onclick="app.adjustValue('weight', 2.5)" class="touch w-9 h-12 bg-white/5 hover:bg-white/10 rounded-xl text-textMuted flex items-center justify-center text-xs"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2 text-center">Reps</label>
                            <div class="flex items-center gap-1">
                                <button onclick="app.adjustValue('reps', -1)" class="touch w-9 h-12 bg-white/5 hover:bg-white/10 rounded-xl text-textMuted flex items-center justify-center text-xs"><i class="fas fa-minus"></i></button>
                                <input type="number" id="inputReps" value="" placeholder="0" class="input-field w-full h-12 text-center text-white font-black text-xl">
                                <button onclick="app.adjustValue('reps', 1)" class="touch w-9 h-12 bg-white/5 hover:bg-white/10 rounded-xl text-textMuted flex items-center justify-center text-xs"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2 text-center">RIR</label>
                            <select id="inputRIR" class="input-field w-full h-12 text-center text-white font-bold text-lg appearance-none cursor-pointer">
                                <option value="0">0</option>
                                <option value="0.5">0.5</option>
                                <option value="0" selected>0</option>
                                <option value="1.5">1.5</option>
                                <option value="2">2</option>
                                <option value="2.5">2.5</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="app.addSeries()" class="touch btn-primary w-full py-4 text-sm" style="background: linear-gradient(135deg, ${cat.color}dd 0%, ${cat.color}aa 100%); box-shadow: 0 4px 20px ${cat.color}30">
                        <i class="fas fa-plus-circle mr-2"></i>Agregar serie ${seriesNum}
                    </button>
                </div>

                <!-- Series de la sesión -->
                ${sessionEntries.length > 0 ? `
                <div class="card p-4">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-bold text-text">Sesión actual</h3>
                        <span class="text-[10px] font-bold text-textMuted bg-white/5 px-2 py-1 rounded-lg">${sessionEntries.length} series</span>
                    </div>
                    <div class="space-y-2">
                        ${this.groupEntriesByExercise(sessionEntries).map(group => {
                            const ex = this.exercises.find(e => e.id === group.exerciseId);
                            return `
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <div class="w-1.5 h-1.5 rounded-full" style="background: ${cat.color}"></div>
                                    <span class="text-xs font-bold text-text">${ex?.name}</span>
                                </div>
                                <div class="space-y-1.5 ml-3">
                                    ${group.entries.map((entry, idx) => {
                                        const rm = this.calcRM(entry.weight, entry.reps);
                                        const best = app.getBestHistoricalSeries(group.exerciseId, idx + 1);
                                        const isNewRecord = best && (entry.weight > best.weight || (entry.weight === best.weight && entry.reps > best.reps));
                                        return `
                                        <div class="series-row p-3 flex items-center justify-between ${isNewRecord ? 'record-flash' : ''}">
                                            <div class="flex items-center gap-3">
                                                <span class="text-[10px] font-black text-textMuted bg-black/30 px-2 py-0.5 rounded">S${idx + 1}</span>
                                                <span class="font-bold text-sm text-text">${entry.weight}<span class="text-textMuted text-xs ml-0.5">kg</span></span>
                                                <span class="text-textMuted text-xs">×</span>
                                                <span class="font-bold text-sm text-text">${entry.reps}</span>
                                                ${entry.rir > 0 ? `<span class="text-[10px] text-textMuted">RIR ${entry.rir}</span>` : ''}
                                            </div>
                                            <div class="flex items-center gap-2">
                                                ${isNewRecord ? `<span class="text-[10px] font-bold text-success bg-success/10 px-2 py-1 rounded-lg"><i class="fas fa-crown mr-1"></i>Récord</span>` : ''}
                                                <span class="text-[10px] font-bold text-purple-400 bg-purple-500/10 px-2 py-1 rounded-lg">RM ${rm.toFixed(1)}</span>
                                                <button onclick="app.showEntryActions('${entry.tempId}')" class="touch text-textMuted hover:text-text w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors"><i class="fas fa-ellipsis-v text-xs"></i></button>
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
                ` : ''}
            </div>
        `;
        // Actualizar display del cronómetro si está activo
        setTimeout(() => this.updateRestTimerDisplay(), 50);
    },

    showDatePickerModal(categoryId) {
        const today = BogotaTime.toDateInputValue();
        const cat = this.categories.find(c => c.id === categoryId);
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <h3 class="text-xl font-black text-text mb-1 tracking-tight">Nuevo entrenamiento</h3>
            <p class="text-textSecondary text-sm mb-6">${cat?.name}</p>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-textMuted uppercase tracking-wider block mb-2">Fecha</label>
                    <input type="date" id="workoutDate" value="${today}" max="${today}" class="input-field w-full px-4 py-3 text-white font-bold text-sm">
                </div>
                <div class="flex gap-3">
                    <button onclick="app.closeModal()" class="touch flex-1 py-3 bg-white/5 hover:bg-white/10 text-text font-bold rounded-xl text-sm transition-colors">Cancelar</button>
                    <button onclick="app.startWorkout('${categoryId}')" class="touch flex-1 btn-primary py-3 text-sm">Comenzar</button>
                </div>
            </div>
        `;
        document.getElementById('modalOverlay').classList.remove('hidden');
    },

    startWorkout(categoryId) {
        const isRest = categoryId === 'cat5';
        const exercises = this.exercises.filter(e => e.categoryIds && e.categoryIds.includes(categoryId));
        if (!isRest && exercises.length === 0) {
            this.showToast('No hay ejercicios en esta categoría', 'error');
            return;
        }
        const dateInput = document.getElementById('workoutDate');
        const selectedDate = dateInput ? BogotaTime.parseDateInput(dateInput.value) : BogotaTime.now();
        this.closeModal();
        this.currentWorkout = {
            id: Date.now().toString(),
            date: selectedDate.toISOString(),
            categoryId: categoryId,
            currentExerciseId: exercises[0]?.id || null,
            entries: [],
            isRest: isRest
        };
        Storage.setCurrentWorkout(this.currentWorkout);
        this.showView('workout');
    },

    changeExercise(exerciseId) {
        if (this.currentWorkout) {
            this.currentWorkout.currentExerciseId = exerciseId;
            Storage.setCurrentWorkout(this.currentWorkout);
            this.renderWorkout();
        }
    },

    adjustValue(field, delta) {
        const input = document.getElementById(field === 'weight' ? 'inputWeight' : 'inputReps');
        let val = parseFloat(input.value) || 0;
        val = Math.max(0, val + delta);
        input.value = val;
    },

    addSeries() {
        const weight = parseFloat(document.getElementById('inputWeight').value);
        const reps = parseInt(document.getElementById('inputReps').value);
        const rir = parseFloat(document.getElementById('inputRIR').value);
        if (!weight || !reps || weight <= 0 || reps <= 0) {
            this.showToast('Ingresa peso y repeticiones', 'error');
            return;
        }
        const currentExerciseId = this.currentWorkout.currentExerciseId;
        const seriesCount = this.currentWorkout.entries.filter(e => e.exerciseId === currentExerciseId).length;
        this.currentWorkout.entries.push({
            tempId: Date.now().toString(),
            exerciseId: currentExerciseId,
            seriesNum: seriesCount + 1,
            weight, reps, rir, notes: ''
        });
        Storage.setCurrentWorkout(this.currentWorkout);
        this.showToast(`Serie ${seriesCount + 1} agregada`);
        this.renderWorkout();
        // Restaurar el peso de la última serie para el siguiente input
        const lastEntry = this.currentWorkout.entries
            .filter(e => e.exerciseId === currentExerciseId)
            .slice(-1)[0];
        if (lastEntry) {
            const wInput = document.getElementById('inputWeight');
            if (wInput) wInput.value = lastEntry.weight;
        }
        const rInput = document.getElementById('inputReps');
        if (rInput) { rInput.value = ''; }
        // Reiniciar e iniciar cronómetro de descanso
        this.resetRestTimer();
        this.startRestTimer();
    },

    deleteEntry(tempId) {
        this.currentWorkout.entries = this.currentWorkout.entries.filter(e => e.tempId !== tempId);
        const grouped = this.groupEntriesByExercise(this.currentWorkout.entries);
        let newEntries = [];
        grouped.forEach(g => {
            g.entries.forEach((entry, idx) => {
                entry.seriesNum = idx + 1;
                newEntries.push(entry);
            });
        });
        this.currentWorkout.entries = newEntries;
        Storage.setCurrentWorkout(this.currentWorkout);
        this.renderWorkout();
    },

    async sendToSheets(workout) {
        const config = Storage.getSheetsConfig();
        if (!config.url) {
            this.showToast('Configura la URL de Google Sheets primero', 'error');
            return false;
        }
        const cat = this.categories.find(c => c.id === workout.categoryId);
        const isRest = workout.isRest || cat?.id === 'cat5';
        const rows = [];
        if (isRest) {
            rows.push({
                fecha: BogotaTime.toLocaleDateString(workout.date),
                categoria: cat?.name || 'Descanso',
                tipo: 'Descanso',
                ejercicio: '-',
                grupo: '-',
                tipo_ej: '-',
                serie: '-',
                peso: '-',
                reps: '-',
                rir: '-',
                volumen: '-',
                rm: '-'
            });
        } else {
            workout.entries?.forEach(e => {
                const ex = this.exercises.find(exe => exe.id === e.exerciseId);
                rows.push({
                    fecha: BogotaTime.toLocaleDateString(workout.date),
                    categoria: cat?.name || '-',
                    tipo: 'Entrenamiento',
                    ejercicio: ex?.name || '-',
                    grupo: ex?.muscleGroup || '',
                    tipo_ej: ex?.type || '',
                    serie: e.seriesNum || 1,
                    peso: e.weight,
                    reps: e.reps,
                    rir: e.rir || 0,
                    volumen: e.weight * e.reps,
                    rm: this.calcRM(e.weight, e.reps).toFixed(2)
                });
            });
        }
        try {
            const res = await fetch(config.url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rows })
            });
            this.showToast('Guardado en Google Sheets ✅');
            return true;
        } catch (err) {
            this.showToast('Error al guardar en Sheets', 'error');
            console.error(err);
            return false;
        }
    },

    finishWorkout() {
        if (this.currentWorkout.entries.length === 0 && !this.currentWorkout.isRest) {
            this.showToast('Agrega al menos una serie', 'error');
            return;
        }
        this.workouts = [...this.workouts, this.currentWorkout];
        const savedWorkout = this.currentWorkout;
        this.currentWorkout = null;
        this.resetRestTimer();
        Storage.clearCurrentWorkout();
        const last = this.workouts[this.workouts.length - 1];
        const msg = last.isRest ? 'Descanso registrado 🛌' : 'Entrenamiento guardado 💪';
        this.showToast(msg);
        // Auto-guardar en Sheets si está configurado
        const config = Storage.getSheetsConfig();
        if (config.autoSave && config.url) {
            this.sendToSheets(savedWorkout);
        }
        this.showView('dashboard');
    },

    groupEntriesByExercise(entries) {
        const groups = {};
        entries.forEach(e => {
            if (!groups[e.exerciseId]) groups[e.exerciseId] = [];
            groups[e.exerciseId].push(e);
        });
        return Object.keys(groups).map(id => ({ exerciseId: id, entries: groups[id] }));
    },

    getLastWorkoutByCategory(categoryId) {
        const workouts = this.workouts.filter(w => w.categoryId === categoryId);
        if (workouts.length === 0) return null;
        return [...workouts].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
    },

    getBestHistoricalSeries(exerciseId, seriesNum) {
        const allEntries = this.workouts.flatMap(w => 
            w.entries?.filter(e => e.exerciseId === exerciseId && e.seriesNum === seriesNum) || []
        );
        if (allEntries.length === 0) return null;
        return allEntries.reduce((best, entry) => {
            if (entry.weight > best.weight) return entry;
            if (entry.weight === best.weight && entry.reps > best.reps) return entry;
            return best;
        });
    },

    getBestSeriesForExercise(exerciseId) {
        const allEntries = this.workouts.flatMap(w => 
            w.entries?.filter(e => e.exerciseId === exerciseId) || []
        );
        if (allEntries.length === 0) return [];
        const bySeries = {};
        allEntries.forEach(e => {
            const sn = e.seriesNum || 1;
            if (!bySeries[sn]) bySeries[sn] = [];
            bySeries[sn].push(e);
        });
        const results = [];
        Object.keys(bySeries).sort((a, b) => parseInt(a) - parseInt(b)).forEach(sn => {
            const best = bySeries[sn].reduce((best, entry) => {
                if (entry.weight > best.weight) return entry;
                if (entry.weight === best.weight && entry.reps > best.reps) return entry;
                return best;
            });
            results.push({ seriesNum: parseInt(sn), weight: best.weight, reps: best.reps });
        });
        return results;
    },

    getBestWeightForExercise(exerciseId) {
        const allEntries = this.workouts.flatMap(w => 
            w.entries?.filter(e => e.exerciseId === exerciseId) || []
        );
        if (allEntries.length === 0) return null;
        return Math.max(...allEntries.map(e => e.weight));
    },

    renderReferenceContent() {
        const currentExId = this.currentWorkout?.currentExerciseId;
        const currentEx = this.exercises.find(e => e.id === currentExId);
        const view = this.refView;

        // Toggle compacto arriba
        let html = `
            <div class="flex items-center gap-1 mb-0.5">
                <button onclick="app.toggleRefView()" class="px-2 py-0.5 rounded text-[9px] font-bold transition ${view === 'best' ? 'bg-warning/20 text-warning' : 'text-textMuted hover:text-text'}">
                    <i class="fas fa-trophy mr-0.5 text-[8px]"></i>Mejor
                </button>
                <button onclick="app.toggleRefView()" class="px-2 py-0.5 rounded text-[9px] font-bold transition ${view === 'last' ? 'bg-primary/20 text-primary' : 'text-textMuted hover:text-text'}">
                    <i class="fas fa-history mr-0.5 text-[8px]"></i>Anterior
                </button>
            </div>
        `;

        if (view === 'best') {
            const bestSeries = currentExId ? this.getBestSeriesForExercise(currentExId) : [];
            if (!currentEx || bestSeries.length === 0) {
                return html + '<div class="text-[10px] text-textMuted truncate">Sin registros</div>';
            }
            html += `<div class="flex items-center gap-2 overflow-x-auto no-scrollbar min-w-0">
                ${bestSeries.map(s => `
                    <span class="text-[10px] text-text font-bold whitespace-nowrap flex-shrink-0">
                        <span class="text-warning">S${s.seriesNum}</span> ${s.weight}kg×${s.reps}
                    </span>
                `).join('')}
            </div>`;
            return html;
        }

        // view === 'last'
        const lastWorkout = this.getLastWorkoutByCategory(this.currentWorkout.categoryId);
        if (!lastWorkout) {
            return html + '<div class="text-[10px] text-textMuted truncate">Sin entrenamientos previos</div>';
        }

        const filteredEntries = lastWorkout.entries?.filter(e => e.exerciseId === currentExId) || [];

        if (filteredEntries.length === 0) {
            return html + `<div class="text-[10px] text-textMuted truncate">Sin datos de "${currentEx?.name}"</div>`;
        }

        html += `<div class="flex items-center gap-2 overflow-x-auto no-scrollbar min-w-0">
            ${filteredEntries.map((e, i) => `
                <span class="text-[10px] text-text font-bold whitespace-nowrap flex-shrink-0">
                    <span class="text-primary">S${i + 1}</span> ${e.weight}kg×${e.reps}
                </span>
            `).join('')}
        </div>`;

        return html;
    },

        return weight * (1 + reps / 30);
    },

    renderProgressCharts() {
        const exerciseId = document.getElementById('progressExercise')?.value || 'all';
        const allEntries = [];
        this.workouts.forEach(w => {
            w.entries?.forEach(e => {
                if (exerciseId === 'all' || e.exerciseId === exerciseId) {
                    allEntries.push({
                        date: new Date(w.date),
                        weight: e.weight,
                        reps: e.reps,
                        rm: this.calcRM(e.weight, e.reps),
                        volume: e.weight * e.reps,
                        exercise: this.exercises.find(ex => ex.id === e.exerciseId)?.name || 'Desconocido'
                    });
                }
            });
        });
        allEntries.sort((a, b) => a.date - b.date);
        const totalPoints = allEntries.length;
        const skip = totalPoints > 20 ? Math.ceil(totalPoints / 10) : (totalPoints > 10 ? 2 : 1);
        const labels = allEntries.map((e, i) => i % skip === 0 ? `${e.date.getDate()}/${e.date.getMonth()+1}` : '');

        const createChart = (canvasId, data, label, color) => {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            if (ctx.chart) ctx.chart.destroy();
            const container = ctx.parentElement;
            if (container) container.style.height = '200px';

            ctx.chart = new Chart(ctx, {
                type: 'line',
                data: { 
                    labels, 
                    datasets: [{ 
                        label, 
                        data, 
                        borderColor: color, 
                        backgroundColor: color + '12', 
                        fill: true, 
                        tension: 0.3, 
                        pointRadius: totalPoints > 30 ? 2 : 3, 
                        pointHoverRadius: 5, 
                        pointBackgroundColor: color, 
                        borderWidth: 2 
                    }] 
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.95)',
                            titleColor: '#f9fafb',
                            bodyColor: '#f9fafb',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            padding: 10,
                            cornerRadius: 10,
                            displayColors: false,
                            callbacks: {
                                title: function(context) {
                                    const idx = context[0].dataIndex;
                                    const entry = allEntries[idx];
                                    return entry ? `${entry.exercise} — ${BogotaTime.toLocaleDateString(entry.date)}` : '';
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            ticks: { 
                                color: '#6b7280', 
                                font: { size: 9, weight: '600' },
                                maxRotation: 0,
                                autoSkip: false,
                                callback: function(val, index) { return labels[index] || ''; }
                            }, 
                            grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false } 
                        },
                        y: { 
                            ticks: { 
                                color: '#6b7280', 
                                font: { size: 9, weight: '600' },
                                padding: 8
                            }, 
                            grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false } 
                        }
                    },
                    interaction: { intersect: false, mode: 'index' }
                }
            });
        };

        if (allEntries.length === 0) {
            ['chartWeight', 'chartRM', 'chartVolume'].forEach(id => {
                const ctx = document.getElementById(id);
                if (ctx) {
                    const container = ctx.parentElement;
                    if (container) {
                        container.style.height = '100px';
                        container.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-textMuted"><i class="fas fa-chart-line text-2xl mb-2 opacity-20"></i><span class="text-xs font-medium">Sin datos</span></div>';
                    }
                }
            });
            return;
        }

        createChart('chartWeight', allEntries.map(e => e.weight), 'Peso (kg)', '#3b82f6');
        createChart('chartRM', allEntries.map(e => e.rm), 'RM (kg)', '#a855f7');
        createChart('chartVolume', allEntries.map(e => e.volume), 'Volumen (kg)', '#f59e0b');
    },

    async testSheetsConnection() {
        const config = Storage.getSheetsConfig();
        if (!config.url) {
            this.showToast('Ingresa la URL del Web App', 'error');
            return;
        }
        this.showToast('Probando conexión...');
        try {
            await fetch(config.url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ test: true, rows: [] })
            });
            this.showToast('Conexión exitosa ✅');
        } catch (err) {
            this.showToast('Error de conexión', 'error');
        }
    },

    exportToCSV() {
        const workouts = this.workouts;
        if (workouts.length === 0) {
            this.showToast('No hay datos para exportar', 'error');
            return;
        }
        const headers = ['Fecha', 'Categoria', 'Tipo_Dia', 'Ejercicio', 'Grupo_Muscular', 'Tipo_Ejercicio', 'Serie', 'Peso_kg', 'Reps', 'RIR', 'Volumen_Serie', 'RM_Estimado'];
        const rows = [];
        workouts.forEach(w => {
            const cat = this.categories.find(c => c.id === w.categoryId);
            const date = BogotaTime.toLocaleDateString(w.date);
            const isRest = w.isRest || cat?.id === 'cat5';
            if (isRest) {
                rows.push([date, cat?.name || 'Descanso', 'Descanso', '-', '-', '-', '-', '-', '-', '-', '-', '-']);
                return;
            }
            w.entries?.forEach(e => {
                const ex = this.exercises.find(exe => exe.id === e.exerciseId);
                rows.push([
                    date, cat?.name || '-', 'Entrenamiento', ex?.name || '-', ex?.muscleGroup || '', ex?.type || '',
                    e.seriesNum || 1, e.weight, e.reps, e.rir || 0, e.weight * e.reps, this.calcRM(e.weight, e.reps).toFixed(2)
                ]);
            });
        });
        rows.sort((a, b) => new Date(b[0].split('/').reverse().join('-')) - new Date(a[0].split('/').reverse().join('-')));
        const csvContent = [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n');
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `tracker_fuerza_${BogotaTime.toDateInputValue()}.csv`;
        link.style.display = 'none';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.showToast('CSV descargado 📊');
    },
